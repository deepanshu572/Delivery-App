<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery App - OTP</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css"
    integrity="sha512-gzw5zNP2TRq+DKyAqZfDclaTG4dOrGJrwob2Fc8xwcJPDPVij0HowLIMZ8c1NefFM0OZZYUUUNoPfcoI5jqudw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
  <div class="main">
    <div class="otp_page">
      <div class="back_btn" onclick="location.href = 'login.html'">
        <div class="back_btn_arrow">
          <i class="ti ti-arrow-narrow-left"></i>
        </div>
        <h5>OTP Verification</h5>
      </div>
      <form onsubmit="handleOtpLogin(event);" class="wrap_login">
        <!-- <h1>Enter OTP to verify</h1> -->

        <div class="otp_info">
          <p>
            A 6 digit OTP has been sent to your phone number <br>
            +91 <span id="phone">7903737980</span>
            <a href="#" class="change_btn">Change</a>
          </p>
        </div>

        <!-- <div class="label_inp">Enter OTP Text</div> -->

        <div class="otp_inputs">
          <input type="tel" maxlength="1">
          <input type="tel" maxlength="1">
          <input type="tel" maxlength="1">
          <input type="tel" maxlength="1">
          <input type="tel" maxlength="1">
          <input type="tel" maxlength="1">
        </div>

        <button class="verify_btn" type="submit">Verify OTP</button>
        <p class="resend">Didn't receive it? <a href="#" class="info-note">Resend OTP</a></p>
      </form>
    </div>
  </div>
</body>
<!-- <script src="assets/js/script.js"></script> -->
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="assets/js/auth.js"></script>



</html>
