<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home — Rider App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
   <div class="main">
    <section class="screen" id="screen-home">
      <div class="body-scroll">
        <div class="greeting-card">
          <div class="greeting-left">
            <div class="avatar">D</div>
            <div>
              <p class="greet-sub">Good Morning,</p>
              <p class="greet-name">Deepanshu</p>
            </div>
          </div>
          <div class="bell"><i data-lucide="bell"></i></div>
        </div>

        <div class="toggle-card">
          <span class="status-text" id="dutyLabel">You're online</span>
          <div class="switch" id="dutySwitch" onclick="toggleDuty()"><div class="knob"></div></div>
        </div>

        <div class="demo-mode-card">
          <div class="demo-label">Demo: choose payment mode for next order</div>
          <div class="demo-mode-row">
            <button id="btnCod" class="selected cod" onclick="setMode('cod')">Cash On Delivery</button>
            <button id="btnOnline" class="online" onclick="setMode('online')">Online Paid</button>
          </div>
        </div>

       <div class="earnings-card">
          <div class="wrap">

            <div class="label">Today's Earnings</div>
            <div class="amount">₹850.00</div>
          </div>
          <i data-lucide="wallet"></i>

        </div>

        <div class="stats-row">
          <div class="stat-card"><div class="stat-num">12</div><div class="stat-lbl">Completed</div></div>
          <div class="stat-card"><div class="stat-num">4.8 ⭐</div><div class="stat-lbl">Rating</div></div>
          <div class="stat-card"><div class="stat-num">95%</div><div class="stat-lbl">Acceptance</div></div>
        </div>

        <div class="incentive-card">
          <div>
            <div class="title">Incentive Zone</div>
            <div class="sub">Complete 20 deliveries to earn ₹200 extra</div>
          </div>
          <div class="gift">🎁</div>
        </div>

              <div class="wrap_track">

          <a class="new-order-fab" id="newOrderBtn" href="new-order.html?mode=cod"><i data-lucide="volume-2"></i>
          </a>
          <h4>New Order</h4>
        </div>
      </div>

      <div class="bottom-nav">
        <div class="nav-item active"><span class="ic">🏠</span>Home</div>
        <a class="nav-item" href="my-orders.html"><span class="ic">📦</span>Orders</a>
        <div class="nav-item"><span class="ic">💰</span>Earnings</div>
        <div class="nav-item"><span class="ic">👤</span>Profile</div>
      </div>
    </section>
</div>

<script src="app.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    lucide.createIcons();
  let duty = true;
  let mode = 'cod';

  function toggleDuty(){
    duty = !duty;
    document.getElementById('dutySwitch').classList.toggle('off', !duty);
    document.getElementById('dutyLabel').textContent = duty ? "You're online" : "You're offline";
  }

  function setMode(m){
    mode = m;
    document.getElementById('btnCod').classList.toggle('selected', m === 'cod');
    document.getElementById('btnOnline').classList.toggle('selected', m === 'online');
    document.getElementById('newOrderBtn').setAttribute('href', withMode('new-order.html', mode));
  }
</script>
</body>
</html>
