<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiderFlow — Reach Drop Location</title>
  <meta name="description"
    content="Deliver to the customer: route map with ETA, customer contact shortcuts and swipe to confirm arrival at the drop point." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/rider.css" />
</head>

<body>


  <div class="phone">


    <div class="appbar">
      <div class="left">
        <svg class="ic c-primary" viewBox="0 0 24 24">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <h1>Reach drop</h1>
      </div>
      <span class="pill primary">ETA 12 min</span>
    </div>

    <div class="screen">
      <div class="map map-250">
        <svg class="route" viewBox="0 0 320 320">
          <path d="M40 290 C 90 250, 70 190, 130 170 S 210 140, 230 60" stroke="oklch(0.55 0.19 255)" stroke-width="7"
            fill="none" opacity=".25" stroke-linecap="round" />
          <path d="M40 290 C 90 250, 70 190, 130 170 S 210 140, 230 60" stroke="oklch(0.55 0.19 255)" stroke-width="3.5"
            fill="none" stroke-dasharray="10 12" stroke-linecap="round" />
        </svg>
        <span class="float float-tl">ETA · 12 mins</span>
        <span class="pin l72 t30"><i><b></b></i></span>
      </div>

      <div class="sheet">
        <div class="grabber"></div>
        <div class="card p mt3">
          <p class="title">Rahul Kumar</p>
          <p class="muted">Yamuna Apartment, 150115768, Ranchi, Jharkhand 834002</p>
          <div class="grid2 mt4">
            <a class="btn" href="tel:+919000000000"><svg class="ic" viewBox="0 0 24 24">
                <path
                  d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z" />
              </svg>Call</a>
            <a class="btn filled" href="https://maps.google.com/?q=Ranchi+Jharkhand+834002" target="_blank"
              rel="noopener"><svg class="ic" viewBox="0 0 24 24">
                <polygon points="3 11 22 2 13 21 11 13 3 11" />
              </svg>Go to map</a>
          </div>
        </div>
        <div class="mt4" class="px-4">
          <p class="muted row"><svg class="ic" viewBox="0 0 24 24">
              <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" />
              <path d="M8 8h8M8 12h8" />
            </svg> Order 5671002428</p>
          <p class="muted row mt2"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6 2v7"></path>
  <path d="M3 2v7a3 3 0 0 0 6 0V2"></path>
  <path d="M6 12v10"></path>

  <path d="M18 2c-2 2-3 5-3 8 0 2 1 3 3 3v9"></path>
  <path d="M18 2v20"></path>
</svg> Pickup: Rasoi Ghar</p>
        </div>
      </div>
    </div>

    <div class="cta-wrap">
      <div class="swipe" data-next="/pages/delivered.html" data-done="Arrived at drop">
        <div class="fillbar"></div>
        <div class="txt">Reached drop location</div>
        <div class="knob"><svg class="ic" viewBox="0 0 24 24">
            <path d="m9 18 6-6-6-6" />
          </svg></div>
      </div>
    </div>
  </div>



  <script src="../assets/js/rider.js"></script>

</body>

</html>
