<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Completed — Rider App</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="main">

  <section class="screen" id="screen-completed">
    <div class="topbar">
      <span></span>
      <h2>Delivery Completed</h2>
      <button class="help-link">Help</button>
    </div>
    <div class="body-scroll">
      <div class="completed-hero">
        <div class="completed-check"><div class="inner">✓</div></div>
        <h3>Delivery Completed Successfully 🎉</h3>
      </div>

      <div class="card">
        <div class="row"><span class="label">Order Amount</span><span class="value">₹450.00</span></div>
        <div class="row"><span class="label">Payment Type</span><span id="payPill"></span></div>
        <div class="row"><span class="label">Cash Collected</span><span class="value" id="cashCollectedValue">₹450.00</span></div>
        <div class="row"><span class="label">Rider Earning</span><span class="value text-green">₹45.00</span></div>
      </div>

      <div class="completed-thanks">Thank you for completing the delivery.</div>
    </div>
    <div class="footer-actions">
      <div class="slide-confirm tone-green" id="newOrderBtn" data-target="home.html">
        <div class="slide-confirm-handle"></div>
        <span class="slide-confirm-label">Slide for new order</span>
      </div>
    </div>
  </section>
</div>


<script src="app.js"></script>
<script>
  const mode = getParam('mode', 'cod');
  document.getElementById('payPill').innerHTML = pillHTML(mode);
  document.getElementById('cashCollectedValue').textContent = mode === 'cod' ? '₹450.00' : 'Already Paid';
</script>
</body>
</html>
