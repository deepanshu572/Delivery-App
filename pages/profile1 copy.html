<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="../assets/css/style.css">

    <style>
       
        .profile_form {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            padding: 18px 12px 25px;
            font-family: var(--font1);
        }

        /* Heading */
        .profile_form h1 {
              font-size: 20px;
    font-weight: 400;
    color: #111;
    margin-bottom: 3px;
        }

        .profile_form .description {
            font-size: 12px;
            /* line-height: 20px; */
            color: #111;
            margin-bottom: 16px;
        }

        /* Form group */
        .form_group {
            margin-bottom: 9px;
        }

        .form_group label {
            display: block;
            font-size: 16px;
            color: #5c5c5c;
            margin-bottom: 7px;
        }

        /* Inputs */
        .form_input {
             width: 100%;
    /* height: 46px; */
    border: 1px solid #aeb3bd;
    border-radius: 10px;
    outline: none;
    padding: 0 15px;
    /* font-size: 15px; */
    /* color: #333; */
    /* background: #fff; */
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    padding: 11px 13px;
    border-radius: 9px;
    outline: none;
    /* border: 1px solid #969AA4; */
    border: 1px solid #d0d0d0;
        }

        .form_input::placeholder {
            color: #9da2ad;
        }

        .form_input:focus {
            border-color: #999;
            box-shadow: 0 0 0 2px rgba(255, 0, 25, 0.05);
        }

        /* Date input */
        .date_wrapper {
            position: relative;
        }

        .date_wrapper input {
            /* padding-right: 45px; */
        }

        .date_icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff0019;
            font-size: 20px;
            pointer-events: none;
        }

        /* Select style */
        .select_box {
            position: relative;
        }

        .select_box .form_input {
            padding-right: 45px;
            cursor: pointer;
        }

        .arrow_icon {
            position: absolute;
            right: 17px;
            top: 50%;
            transform: translateY(-50%);
            color: #8d939d;
            font-size: 20px;
            pointer-events: none;
        }

        /* Profile upload */
        .profile_upload {
            height: 85px;
            border: 1px dashed #b9bdc5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .profile_preview {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile_preview i {
            font-size: 55px;
            color: #969ba5;
        }

        .upload_btn {
            height: 41px;
            min-width: 190px;
            border: 1px solid #ff4b58;
            border-radius: 22px;
            background: #fff;
            color: #ff4050;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            transition: all 0.2s ease;
        }

        .upload_btn i {
            font-size: 16px;
        }

        .upload_btn:hover {
            background: #fff5f6;
            box-shadow: 0 3px 10px rgba(255, 0, 25, 0.12);
        }

        /* Submit */
        .submit_btn {
                width: 100%;
    height: 40px;
    border: none;
    border-radius: 26px;
    background: var(--theme-color);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    margin-top: 20px;

            cursor: pointer;

            box-shadow: 0 3px 8px rgba(255, 0, 25, 0.12);

            transition: all 0.2s ease;
        }

        .submit_btn:hover {
            box-shadow: 0 6px 15px rgba(255, 0, 25, 0.22);
        }

        .submit_btn:active {
            transform: scale(0.98);
        }

        /* Desktop */
        @media (min-width: 600px) {
            .profile_form {
                max-width: 500px;
            }
        }
    </style>
</head>

<body>

<div class="profile_form">

    <h1>Personal information</h1>

    <p class="description">
        Enter the details below so we can get to know
        and serve you better
    </p>

    <!-- First Name -->
    <div class="form_group">
        <label>First Name</label>
        <input
            type="text"
            class="form_input"
            placeholder="Please enter first name"
        >
    </div>

    <!-- Last Name -->
    <div class="form_group">
        <label>Last Name</label>
        <input
            type="text"
            class="form_input"
            placeholder="Please enter last name"
        >
    </div>

    <!-- Father's Name -->
    <div class="form_group">
        <label>Father’s Name</label>
        <input
            type="text"
            class="form_input"
            placeholder="Please enter father’s name"
        >
    </div>

    <!-- Date of Birth -->
    <div class="form_group">
        <label>Date of birth</label>

        <div class="date_wrapper">
            <input
                type="date"
                class="form_input"
                placeholder="dd-mm-yyyy"
            >

        </div>
    </div>

    <!-- Primary Mobile -->
    <div class="form_group">
        <label>Primary mobile number</label>
        <input
            type="tel"
            class="form_input"
            placeholder="+91 1234567890"
        >
    </div>

    <!-- WhatsApp -->
    <div class="form_group">
        <label>WhatsApp number</label>
        <input
            type="tel"
            class="form_input"
            placeholder="+91 1234567890"
        >
    </div>

    <!-- Secondary -->
    <div class="form_group">
        <label>Secondary mobile number (Optional)</label>
        <input
            type="tel"
            class="form_input"
            placeholder="e.g. 1234567890"
        >
    </div>

    <!-- Blood Group -->
    <div class="form_group">
        <label>Blood Group</label>
        <input
            type="text"
            class="form_input"
            placeholder="Enter blood group here"
        >
    </div>

    <!-- City -->
    <div class="form_group">
        <label>City</label>

        <div class="select_box">
            <input
                type="text"
                class="form_input"
                placeholder="e.g. Ranchi"
            >

        </div>
    </div>

    <!-- Address -->
    <div class="form_group">
        <label>Enter complete address here</label>

        <textarea
            type="text"
            class="form_input"
            placeholder="Search address"
        ></textarea>
    </div>

    <!-- Languages -->
    <div class="form_group">
        <label>Languages you know</label>

        <div class="select_box">
            <input
                type="text"
                class="form_input"
                placeholder="Select one or multiple"
                readonly
            >

        </div>
    </div>

    <!-- Profile Picture -->
    <div class="form_group">
        <label>Your Profile Picture</label>
        <input type="file" name="pic" id="pic" hidden>

        <label for="pic">

            <div class="profile_upload">
    
                <div class="profile_preview">
                    <i class="fa-solid fa-user"></i>
                </div>
    
                <button type="button" class="upload_btn">
                    <i class="fa-solid fa-camera"></i>
                    Upload Photo
                </button>
    
            </div>
        </label>
    </div>

    <!-- Referral -->
    <div class="form_group">
        <label>Referral code (Optional)</label>

        <input
            type="text"
            class="form_input"
            placeholder="Enter referral code"
        >
    </div>

    <!-- Submit -->
    <button type="button" class="submit_btn">
        Submit
    </button>

</div>

</body>
</html>
