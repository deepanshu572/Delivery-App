<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RiderFlow — Personal Information</title>
<meta name="description" content="Partner onboarding: fill in personal details, contact numbers, city, languages and profile photo." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="../assets/css/rider.css" />
<link rel="stylesheet" href="../assets/css/onboarding.css" />
</head>
<body>

<div class="main">

  <div class="phone">
  
  
    <div class="backbar">
      <a href="/pages/onboarding-1.html" aria-label="Back">
        <svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span class="ob-heading">Personal information</span>
    </div>
  
    <div class="screen">
      <form class="ob-body" action="/rider/onboarding-4.html" method="get" style="padding-bottom:20px">
        <p class="ob-sub">Enter the details below so we can get to know and serve you better</p>
  
        <div class="field"><label>First Name</label><input type="text" placeholder="Please enter first name" required /></div>
        <div class="field"><label>Last Name</label><input type="text" placeholder="Please enter last name" required /></div>
        <div class="field"><label>Father's Name</label><input type="text" placeholder="Please enter father's name" /></div>
        <div class="field"><label>Date of Birth</label>
          <div class="with-icon">
            <input type="text" placeholder="dd-mm-yyyy" onfocus="this.type='date'" />
            <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
        </div>
        <div class="field"><label>Primary mobile number</label><input type="tel" value="+91 1234567890" /></div>
        <div class="field"><label>WhatsApp number</label><input type="tel" value="+91 1234567890" /></div>
        <div class="field"><label>Secondary mobile number (Optional)</label><input type="tel" placeholder="e.g. 1234567890" /></div>
        <div class="field"><label>Blood Group</label><input type="text" placeholder="Enter blood group here" /></div>
        <div class="field"><label>City</label>
          <div class="with-icon">
            <input type="text" value="Ranchi" />
            <svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </div>
        <div class="field"><label>Address</label><input type="text" placeholder="Enter complete address here" /></div>
        <div class="field"><input type="text" placeholder="Search address" aria-label="Search address" /></div>
        <div class="field"><label>Languages you know</label>
          <div class="with-icon">
            <input type="text" placeholder="Select one or multiple" />
            <svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        </div>
  
        <div class="field">
          <label>Your Profile Picture</label>
          <div class="row" style="gap:10px">
            <span class="paid-badge" style="background:var(--muted);color:var(--muted-fg)">
              <svg class="ic" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <button type="button" class="upload-btn" data-upload>
              <svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
              Upload Photo
            </button>
          </div>
        </div>
  
        <div class="field"><label>Referral code (Optional)</label><input type="text" placeholder="Enter referral code" /></div>
  
        <button class="btn-primary w-full mt3" type="submit">Submit</button>
      </form>
    </div>
  </div>
</div>


<script src="/assets/js/rider.js"></script>
</body>
