<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiderFlow — Personal Information</title>
  <meta name="description"
    content="Partner onboarding: fill in personal details, contact numbers, city, languages and profile photo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="../assets/css/rider.css" />
  <link rel="stylesheet" href="../assets/css/onboarding.css" />
  <style>
    .backbar{
      padding: 16px 16px;
    }
  </style>
</head>

<body>

  <div class="main">

    <div class="phone">


      <div class="backbar">
        <!-- <a href="/pages/onboarding-1.html" aria-label="Back">
          <svg class="ic" viewBox="0 0 24 24">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </a> -->
        <span class="ob-heading">Personal information</span>
      </div>

      <div class="screen">
        <form class="ob-body" onsubmit="handleInfoInsert(event);" style="padding-bottom:20px">
          <p class="ob-sub">Enter the details below so we can get to know and serve you better</p>

          <div class="field"><label>First Name</label><input id="FirstName" type="text"
              placeholder="Please enter first name" required /></div>
          <div class="field"><label>Last Name</label><input id="LastName" type="text"
              placeholder="Please enter last name" required />
          </div>
          <!-- <div class="field"><label>Date of Birth</label>
          <div class="with-icon">
            <input type="text" placeholder="dd-mm-yyyy" onfocus="this.type='date'" />
            <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
        </div> -->
          <div class="field"><label>mobile number</label><input id="number" type="tel" value="+91 1234567890" required /></div>
          <div class="field"><label>Email</label><input id="email" type="email" placeholder="example@gmail.com"  required/></div>
          <div class="field"><label>City</label>
            <div class="with-icon">
              <input id="city" type="text" placeholder="Ranchi" required />
              <!-- <svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg> -->
            </div>
          </div>
          <div class="field"><label>Address</label><textarea type="text"
             id="address" placeholder="Enter complete address here"></textarea></div>
          <div class="field"><label>Languages you know</label>
            <div class="with-icon">
              <input id="language" type="text" placeholder="Select one or multiple" />
              <!-- <svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg> -->
            </div>
          </div>

          <div class="field">
            <label>Your Profile Picture</label>
            <div class="row" style="gap:10px">
              <span class="circle_img" style="background:var(--muted);color:var(--muted-fg)">
                <svg class="ic" viewBox="0 0 24 24">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <!-- <img src="https://media.istockphoto.com/id/1451587807/vector/user-profile-icon-vector-avatar-or-person-icon-profile-picture-portrait-symbol-vector.jpg?s=612x612&w=0&k=20&c=yDJ4ITX1cHMh25Lt1vI1zBn2cAKKAlByHBvPJ8gEiIg=" alt=""> -->
              </span>
              <label for="profileImg" class="upload-btn">
                <svg class="ic" viewBox="0 0 24 24">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <path d="m17 8-5-5-5 5M12 3v12" />
                </svg>
                Upload Photo
                <input id="profileImg" type="file" style="display: none;">
              </label>

            </div>
          </div>

          <!-- <div class="field"><label>Referral code (Optional)</label><input type="text" placeholder="Enter referral code" /></div> -->

          <button class="btn-primary w-full mt3" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script src="/assets/js/script.js"></script>
  <script>
    getPersonalDetails();

  </script>
</body>
