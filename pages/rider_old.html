<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />

</head>

<body>
    <div class="main ">
        <div class="top_bar_nav">
            <i data-lucide="Box"></i>

            <!-- <img src="../assets/img/icon/rider1.svg" alt=""> -->
            <h5>Order</h5>
        </div>
        <div id="change" class="bg">

            <div class="rider_content ">
                <div class="rider_top_content">
                    <div class="rider_left">
                        <p>Good Morning</p>
                        <h5>Bikash</h5>
                    </div>
                    <div class="rider_right">
                        <button class="off ">OFF</button>
                        <button class="on active_switch">ON</button>
                    </div>
                </div>
                <div class="rider_dashboard">
                    <div class="rider_dash_box">
                        <h5>12</h5>
                        <p>Trip</p>
                    </div>
                    <div class="rider_dash_box">
                        <h5>₹890</h5>
                        <p>Earned</p>
                    </div>
                    <div class="rider_dash_box">
                        <h5>4h</h5>
                        <p>Online</p>
                    </div>
                </div>
            </div>
            <div class="content_holder">
                <div class="content_popup">
                    <div class="circle">
                    </div>
                    <div class="icon_box_wrap">
    
                        <i data-lucide="bike"></i>  
                    </div>
                </div>
                <h4>Waiting for orders</h4>
                <p>You're online. New orders nearby will pop up here instantly.</p>
            </div>
        </div>
        <div class="footer_ride">

            <button class="active"> <i data-lucide="Box"></i>
                Orders</button>
            <button><i data-lucide="user"></i>
                Account</button>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
