<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onboard 1</title>
    <link rel="stylesheet" href="../assets/css/rider.css">
    <link rel="stylesheet" href="../assets/css/onboarding.css">


    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>

<body>
    <div class="main">
        <div class="phone">


            <div class="screen">
                <div class="ob-hero" style="border-radius:0 0 24px 24px;padding:54px 20px">
                    <h2>Welcome to RiderFlow</h2>
                    <p>Just a few steps to complete and then you can start earning with Us</p>
                </div>
                <div class="select_branch">
                    <label for="branchData"> <i class="fi fi-rr-analytics"></i>
                        Select Branch</label>
                    <select name="branch" id="branchData">
                        <option value="0">Select Branch</option>
                    </select>
                </div>

                <div class="ob-body">
                    <div class="bottom_sec_head">
                        <i class="fi fi-rr-document"></i>
                        <h4>Pending Documents</h4>
                    </div>
                    <a class="doc-row" href="doc-1.html">
                        <div class="left_doc">
                            <div class="icon_box">
                                <i class="fi fi-rr-user"></i>
                            </div>
                            <b>Personal Documents</b>
                        </div>
                        <svg class="ic chev" viewBox="0 0 24 24">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </a>
                    <a class="doc-row" href="vehicle-form.html">
                        <div class="left_doc">
                            <div class="icon_box">
                                <i class="fi fi-rr-car"></i>
                            </div>
                            <b>Vehicle Details</b>
                        </div>
                        <svg class="ic chev" viewBox="0 0 24 24">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </a>
                    <a class="doc-row" href="back-form.html">
                        <div class="left_doc">

                            <div class="icon_box">
                                <i class="fi fi-rr-bank"></i>
                            </div>
                            <b>Bank Account Details</b>
                        </div>
                        <svg class="ic chev" viewBox="0 0 24 24">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </a>
                    <a class="doc-row" href="emergency.html">
                        <div class="left_doc">
                            <div class="icon_box">
                                <i class="fi fi-rr-bell-notification-social-media"></i>
                            </div>
                            <b>Emergency Details</b>
                        </div>
                        <svg class="ic chev" viewBox="0 0 24 24">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </a>

                    <div class="bottom_sec_head">
                        <i class="fi fi-rr-analytics"></i>
                        <h4>Completed Documents</h4>

                    </div> <a class="doc-row done" href="profile.html">
                        <span class="tick"><svg class="ic" viewBox="0 0 24 24">
                                <path d="M20 6 9 17l-5-5"></path>
                            </svg></span>
                        <b>Personal Information</b>
                        <svg class="ic chev" viewBox="0 0 24 24">
                            <path d="m9 18 6-6-6-6"></path>
                        </svg>
                    </a>

                    <div class="grow"></div>
                    <button onclick="handleVerification()" class="btn-primary w-full mt3 submit_btn" href="#" style="margin-bottom:20px"><img
                            src="../assets/img/icon/submit.png" alt="">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/js/script.js"></script>
    <script>
        getAllBranch();
    </script>
</body>


</html>
