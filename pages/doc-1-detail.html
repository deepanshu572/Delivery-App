<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RiderFlow — Aadhaar Card Upload</title>
<meta name="description" content="Upload front and back photos of your Aadhaar card for partner verification." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="../assets/css/onboarding.css" />
<link rel="stylesheet" href="../assets/css/rider.css" />
</head>
<body>


<div class="phone">


  <div class="backbar">
    <a href="/pages/doc-1.html" aria-label="Back">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span class="ob-heading">Aadhar card details</span>
  </div>

  <div class="screen">
    <div class="ob-body">
      <p class="ob-sub">Upload focused photo of your Aadhar Card for faster verification</p>

      <div class="upload-box" data-upload-box>
        <p class="hint">Front side photo of your Aadhar card with your clear name and photo</p>
        <img class="upload-preview" alt="Aadhaar front preview" hidden />
        <button type="button" class="upload-btn" data-upload>
          <svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
          Upload Photo
        </button>
      </div>

      <div class="upload-box" data-upload-box>
        <p class="hint">Back side photo of your Aadhar card with your clear name and photo</p>
        <img class="upload-preview" alt="Aadhaar back preview" hidden />
        <button type="button" class="upload-btn" data-upload>
          <svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
          Upload Photo
        </button>
      </div>

      <div class="grow"></div>
      <button class="btn-primary w-full" type="button" data-submit-upload style="margin-bottom:20px" disabled>Submit</button>
    </div>
  </div>
</div>


<!-- <script src="../assets/js/onboarding.js"></script>
<script src="../assets/js/rider.js"></script> -->
</body>
</html>
